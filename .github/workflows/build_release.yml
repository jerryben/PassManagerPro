name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # sqflite_common_ffi on Windows bundles sqlite3.dll automatically
      # since v2.3.0 — no manual setup step needed anymore.

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $dst = "PassManagerPro-Windows.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $dst -Force
          Write-Host "Archive created: $dst"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassManagerPro-Windows
          path: PassManagerPro-Windows.zip
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PassManagerPro-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev \
            liblzma-dev libstdc++-12-dev \
            lld

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Create ZIP archive
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../PassManagerPro-Linux.zip .
          echo "Archive created"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassManagerPro-Linux
          path: PassManagerPro-Linux.zip
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PassManagerPro-Linux.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
