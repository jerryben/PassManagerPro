name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
      
      - name: Setup SQLite for Windows
        run: |
          flutter pub run sqflite_common_ffi:setup_ffi_windows
        
      - name: Build Windows
        run: flutter build windows --release
        
      - name: Create ZIP archive
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath ../../../../../PassManagerPro-Windows.zip
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassManagerPro-Windows
          path: PassManagerPro-Windows.zip
          
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: PassManagerPro-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
